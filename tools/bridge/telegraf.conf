# Telegraf: MorletDB metric bridge as an execd input (#639). Adjust paths, database and outputs.
# Create the sink once:  python3 tools/bridge/cli.py add-sink telegraf line --measurement vibration

[agent]
  interval = "10s"
  flush_interval = "10s"
  precision = "1ns"                 # keep the bridge's nanosecond timestamps

[[inputs.execd]]
  command = ["python3", "/opt/morletdb/tools/bridge/cli.py", "telegraf", "telegraf", "--drain-all"]
  signal = "STDIN"                  # a newline per interval; the bridge answers with the pending points
  restart_delay = "10s"
  data_format = "influx"
  # libpq settings for the bridge's database role; prefer a .pgpass file to a password here
  environment = ["PGHOST=localhost", "PGDATABASE=plant", "PGUSER=morlet_bridge"]

# Any Telegraf output works. Two examples:
[[outputs.influxdb_v2]]
  urls = ["http://127.0.0.1:8086"]
  token = "$INFLUX_TOKEN"
  organization = "plant"
  bucket = "vibration"

