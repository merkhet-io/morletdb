[package]
name = "morlet-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
arbitrary = { version = "=1.5.0", features = ["derive"] }
morlet-core = { path = ".." }

# Not part of the main workspace: built only by cargo-fuzz on nightly. The chunk codec's own targets
# (decode_raw, decode_sealed, roundtrip) are in crates/grizzbit/fuzz.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "decode_frame"
path = "fuzz_targets/decode_frame.rs"
test = false
doc = false
bench = false
