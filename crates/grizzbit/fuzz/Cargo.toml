[package]
name = "grizzbit-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
arbitrary = { version = "=1.5.0", features = ["derive"] }
grizzbit = { path = ".." }

# Not part of the main workspace: built only by cargo-fuzz on nightly.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "decode_raw"
path = "fuzz_targets/decode_raw.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_sealed"
path = "fuzz_targets/decode_sealed.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_v4"
path = "fuzz_targets/decode_v4.rs"
test = false
doc = false
bench = false
