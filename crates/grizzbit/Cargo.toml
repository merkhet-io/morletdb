[package]
name = "grizzbit"
description = "Grizzbit: lossless float64 compression for sampled signals (MorletDB's chunk codec; Grizzbit 1 = chunk format versions 2 and 3)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["compression", "lossless", "float64", "signal", "waveform"]
categories = ["compression", "encoding"]
# Not on crates.io yet: publishing needs the owner's approval.
publish = false

[lib]
name = "grizzbit"

# Grizzbit 1 has no runtime dependencies: the codec, its CRC-32C and its sample limits are all here. Grizzbit 2's
# version-4 chunks use pco, pinned exactly (study B5's frozen build; a later pco is an upgrade gated by the golden
# pco chunks in testdata/rawcodec).
[dependencies]
pco = "=1.0.4"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
proptest = { version = "1.12", default-features = false, features = ["std"] }

[lints]
workspace = true
