name: Alpha release
on:
  push:
    branches: [main]
    paths: ['VERSION', '.github/workflows/release.yml']
  pull_request:
    paths: ['VERSION', '.github/workflows/release.yml', 'compose.release.yaml', 'deploy/Dockerfile', 'deploy/Dockerfile.deb']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alpha-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Each architecture is built natively on its own runner (no emulation), trialled from a clean checkout,
  # and pushed under an architecture tag. The release tag is then one multi-architecture index of the two.
  image:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      publish: ${{ steps.publish.outputs.value }}
    env:
      MORLET_PLATFORM: linux/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate prerelease identifier
        id: version
        shell: bash
        run: |
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Decide whether this run publishes
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
          EVENT: ${{ github.event_name }}
        run: |
          # Pull requests and pushes that change only the workflow (VERSION already released) are dry runs:
          # build and trial, publish nothing. A manual run for an existing version is an error.
          if [ "$EVENT" = pull_request ]; then echo "value=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$VERSION" --jq '.[].ref' > existing-tags.txt
          if grep -Fxq "refs/tags/v$VERSION" existing-tags.txt; then
            if [ "$EVENT" = push ]; then
              echo "::notice::v$VERSION already exists: building and trialling only (dry run); increment VERSION to release."
              echo "value=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "Release already exists; increment VERSION instead of replacing it." >&2
            exit 1
          fi
          echo "value=true" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: morletdb:candidate
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=alpha-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=alpha-${{ matrix.arch }}
      - name: Software bill of materials of the candidate (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: morletdb:candidate
          format: spdx-json
          output-file: morletdb-${{ steps.version.outputs.value }}-${{ matrix.arch }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Keep the SBOM for the release
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.arch }}
          path: morletdb-${{ steps.version.outputs.value }}-${{ matrix.arch }}.spdx.json
          if-no-files-found: error
      - name: Clean-checkout quickstart and restart trial
        env:
          MORLET_IMAGE: morletdb:candidate
          COMPOSE_PROJECT_NAME: alpha-trial
        run: |
          docker compose -f compose.release.yaml run --rm walkthrough
          docker compose -f compose.release.yaml restart db
          docker compose -f compose.release.yaml up --no-build -d --wait db
          docker compose -f compose.release.yaml run --rm walkthrough
      - name: Remove candidate trial volume
        if: always()
        env:
          MORLET_IMAGE: morletdb:candidate
          COMPOSE_PROJECT_NAME: alpha-trial
        run: docker compose -f compose.release.yaml down -v
      - name: Log in to GitHub Container Registry
        if: steps.publish.outputs.value == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image under its architecture tag
        if: steps.publish.outputs.value == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag morletdb:candidate "$image:$VERSION-${{ matrix.arch }}"
          docker push "$image:$VERSION-${{ matrix.arch }}"

  # Debian packages for existing servers: one per PostgreSQL major and architecture, built natively,
  # installed with apt into a clean official postgres image (Debian bookworm, PostgreSQL project packages)
  # and trialled with the image's quickstart and restart before the release may attach them.
  packages:
    strategy:
      fail-fast: true
      matrix:
        pg: ['17', '18']
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - pg: '17'
            data: /var/lib/postgresql/data
          - pg: '18'
            data: /var/lib/postgresql
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      PG_MAJOR: ${{ matrix.pg }}
      MORLET_IMAGE: morletdb:deb-trial
      MORLET_PLATFORM: linux/${{ matrix.arch }}
      MORLET_DATA_PATH: ${{ matrix.data }}
      COMPOSE_PROJECT_NAME: deb-trial
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the package
        run: |
          docker buildx build -f deploy/Dockerfile.deb --target package --platform "$MORLET_PLATFORM" \
            --build-arg PG_MAJOR="$PG_MAJOR" --build-arg VERSION="$(cat VERSION)" \
            --cache-from "type=gha,scope=deb-$PG_MAJOR-${{ matrix.arch }}" \
            --cache-to "type=gha,mode=max,scope=deb-$PG_MAJOR-${{ matrix.arch }}" \
            --output type=local,dest=dist .
          ls -l dist
          test "$(find dist -maxdepth 1 -name '*.deb' | wc -l)" -eq 1
      - name: Install it with apt into a clean postgres image
        run: |
          docker buildx build -f deploy/Dockerfile.deb --target trial --platform "$MORLET_PLATFORM" \
            --build-arg PG_MAJOR="$PG_MAJOR" --build-context dist=dist --load -t "$MORLET_IMAGE" .
      - name: Clean-checkout quickstart and restart trial
        run: |
          docker compose -f compose.release.yaml run --rm walkthrough
          docker compose -f compose.release.yaml restart db
          docker compose -f compose.release.yaml up --no-build -d --wait db
          docker compose -f compose.release.yaml run --rm walkthrough
          docker compose -f compose.release.yaml exec -T db psql -U morlet -d morlet -Atc \
            "SELECT current_setting('server_version_num')::int / 10000, extversion FROM pg_extension WHERE extname = 'pg_morlet'"
      - name: Trial diagnostics
        if: failure()
        run: docker compose -f compose.release.yaml logs db
      - name: Remove trial volume
        if: always()
        run: docker compose -f compose.release.yaml down -v
      - name: Keep the package for the release
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.pg }}-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  sdk-wheels:
    uses: ./.github/workflows/sdk-wheels.yml

  publish:
    needs: image
    if: needs.image.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
      version: ${{ steps.index.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Combine the tested architecture images into the release tag
        id: index
        run: |
          version=$(cat VERSION)
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create -t "$image:$version" "$image:$version-amd64" "$image:$version-arm64"
          digest=$(docker buildx imagetools inspect "$image:$version" --format '{{json .Manifest}}' | jq -r .digest)
          docker buildx imagetools inspect "$image:$version"
          { echo "digest=$image@$digest"; echo "name=$image"; echo "sha=$digest"; echo "version=$version"; } >> "$GITHUB_OUTPUT"
      - name: Build provenance attestation for the release index
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.index.outputs.name }}
          subject-digest: ${{ steps.index.outputs.sha }}
          push-to-registry: true

  registry-trial:
    needs: publish
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MORLET_IMAGE: ${{ needs.publish.outputs.digest }}
      MORLET_PLATFORM: linux/${{ matrix.arch }}
      COMPOSE_PROJECT_NAME: registry-trial
    steps:
      - uses: actions/checkout@v4
      - name: Pull and trial the release digest in a fresh project
        run: |
          docker pull --platform "$MORLET_PLATFORM" "$MORLET_IMAGE"
          docker compose -f compose.release.yaml run --rm walkthrough
          docker compose -f compose.release.yaml restart db
          docker compose -f compose.release.yaml up --no-build -d --wait db
          docker compose -f compose.release.yaml run --rm walkthrough
      - name: Registry trial diagnostics
        if: failure()
        run: docker compose -f compose.release.yaml logs db
      - name: Remove registry trial volume
        if: always()
        run: docker compose -f compose.release.yaml down -v

  release:
    needs: [publish, registry-trial, packages, sdk-wheels]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Collect the SBOMs of both architectures
        uses: actions/download-artifact@v4
        with:
          pattern: sbom-*
          merge-multiple: true
      - name: Collect the trialled Debian packages
        uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
      - name: Collect the tested SDK wheels
        uses: actions/download-artifact@v4
        with:
          pattern: sdk-wheel-*
          merge-multiple: true
      - name: Checksums of the packages
        run: |
          # GitHub release assets cannot contain "~" (it becomes "."), so name the files as GitHub will serve
          # them before the checksums are written; the package version inside stays 0.3.5~alpha.1-1.
          for f in ./*~*.deb; do [ -e "$f" ] && mv -- "$f" "${f//\~/.}"; done
          ls -l -- *.deb
          test "$(find . -maxdepth 1 -name '*.deb' | wc -l)" -eq 4
          ls -l -- *.whl
          test "$(find . -maxdepth 1 -name '*.whl' | wc -l)" -eq 4
          sha256sum -- *.deb *.whl > SHA256SUMS
          cat SHA256SUMS
      - name: Build provenance attestation for the packages
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            *.deb
            *.whl
      - name: Publish GitHub prerelease only after both registry trials succeed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          printf '%s\n' "$DIGEST" > image-digest.txt
          # shellcheck disable=SC2016  # the backticks are Markdown in the release notes, not command substitution
          { cat CHANGELOG.md; printf '\nImage: %s (linux/amd64 and linux/arm64)\nCommit: %s\n' "$DIGEST" "$GITHUB_SHA"
            printf 'SBOMs (SPDX): attached. Verify the build provenance with: gh attestation verify oci://%s --owner %s\n' "$DIGEST" "$GITHUB_REPOSITORY_OWNER"
            printf '\nDebian packages for existing PostgreSQL 17 and 18 servers (PostgreSQL project packages on Debian bookworm; amd64, arm64), each installed with apt and trialled before release: `sudo apt install ./postgresql-17-pg-morlet_<version>_<arch>.deb`, then `CREATE EXTENSION pg_morlet`. Checksums: SHA256SUMS. Verify with: gh attestation verify <file>.deb --owner %s\n' "$GITHUB_REPOSITORY_OWNER"
            printf '\nPython SDK wheels: with the native decoder for compressed transfer on Linux x86-64 and arm64 (manylinux: the glibc version in the file name or later) and macOS 11+ on arm64, and a pure wheel for every other platform, which reads raw samples (same results, slower long reads). Install with: `pip install morletdb-<version>-<platform>.whl`.\n'; } > release-notes.md
          gh release create "v$VERSION" image-digest.txt morletdb-*.spdx.json ./*.deb ./*.whl SHA256SUMS --target "$GITHUB_SHA" --title "MorletDB $VERSION" --prerelease --notes-file release-notes.md
