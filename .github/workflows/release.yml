name: Alpha release
on:
  push:
    branches: [main]
    paths: ['VERSION', '.github/workflows/release.yml']
  pull_request:
    paths: ['VERSION', '.github/workflows/release.yml', 'compose.release.yaml', 'deploy/Dockerfile']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alpha-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Each architecture is built natively on its own runner (no emulation), trialled from a clean checkout,
  # and pushed under an architecture tag. The release tag is then one multi-architecture index of the two.
  image:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      publish: ${{ steps.publish.outputs.value }}
    env:
      MORLET_PLATFORM: linux/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate prerelease identifier
        id: version
        shell: bash
        run: |
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Decide whether this run publishes
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
          EVENT: ${{ github.event_name }}
        run: |
          # Pull requests and pushes that change only the workflow (VERSION already released) are dry runs:
          # build and trial, publish nothing. A manual run for an existing version is an error.
          if [ "$EVENT" = pull_request ]; then echo "value=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$VERSION" --jq '.[].ref' > existing-tags.txt
          if grep -Fxq "refs/tags/v$VERSION" existing-tags.txt; then
            if [ "$EVENT" = push ]; then
              echo "::notice::v$VERSION already exists: building and trialling only (dry run); increment VERSION to release."
              echo "value=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "Release already exists; increment VERSION instead of replacing it." >&2
            exit 1
          fi
          echo "value=true" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: morletdb:candidate
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=alpha-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=alpha-${{ matrix.arch }}
      - name: Clean-checkout quickstart and restart trial
        env:
          MORLET_IMAGE: morletdb:candidate
          COMPOSE_PROJECT_NAME: alpha-trial
        run: |
          docker compose -f compose.release.yaml run --rm walkthrough
          docker compose -f compose.release.yaml restart db
          docker compose -f compose.release.yaml up --no-build -d --wait db
          docker compose -f compose.release.yaml run --rm walkthrough
      - name: Remove candidate trial volume
        if: always()
        env:
          MORLET_IMAGE: morletdb:candidate
          COMPOSE_PROJECT_NAME: alpha-trial
        run: docker compose -f compose.release.yaml down -v
      - name: Log in to GitHub Container Registry
        if: steps.publish.outputs.value == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image under its architecture tag
        if: steps.publish.outputs.value == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag morletdb:candidate "$image:$VERSION-${{ matrix.arch }}"
          docker push "$image:$VERSION-${{ matrix.arch }}"

  publish:
    needs: image
    if: needs.image.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
      version: ${{ steps.index.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Combine the tested architecture images into the release tag
        id: index
        run: |
          version=$(cat VERSION)
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create -t "$image:$version" "$image:$version-amd64" "$image:$version-arm64"
          digest=$(docker buildx imagetools inspect "$image:$version" --format '{{json .Manifest}}' | jq -r .digest)
          docker buildx imagetools inspect "$image:$version"
          echo "digest=$image@$digest" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  registry-trial:
    needs: publish
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MORLET_IMAGE: ${{ needs.publish.outputs.digest }}
      MORLET_PLATFORM: linux/${{ matrix.arch }}
      COMPOSE_PROJECT_NAME: registry-trial
    steps:
      - uses: actions/checkout@v4
      - name: Pull and trial the release digest in a fresh project
        run: |
          docker pull --platform "$MORLET_PLATFORM" "$MORLET_IMAGE"
          docker compose -f compose.release.yaml run --rm walkthrough
          docker compose -f compose.release.yaml restart db
          docker compose -f compose.release.yaml up --no-build -d --wait db
          docker compose -f compose.release.yaml run --rm walkthrough
      - name: Registry trial diagnostics
        if: failure()
        run: docker compose -f compose.release.yaml logs db
      - name: Remove registry trial volume
        if: always()
        run: docker compose -f compose.release.yaml down -v

  release:
    needs: [publish, registry-trial]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish GitHub prerelease only after both registry trials succeed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          printf '%s\n' "$DIGEST" > image-digest.txt
          { cat CHANGELOG.md; printf '\nImage: %s (linux/amd64 and linux/arm64)\nCommit: %s\n' "$DIGEST" "$GITHUB_SHA"; } > release-notes.md
          gh release create "v$VERSION" image-digest.txt --target "$GITHUB_SHA" --title "MorletDB $VERSION" --prerelease --notes-file release-notes.md
