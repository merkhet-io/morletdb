name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p morlet-core
      - run: cargo clippy --locked -p morlet-core --all-targets -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r evaluation/requirements.txt
      - run: cargo build --locked --release -p morlet-core --example features
      - run: python -m unittest discover -s evaluation -p 'test_*.py'
      - name: Wave-index candidate recall and temporal-control report
        run: python evaluation/wave_index.py --size 128 --output wave-index-output/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: wave-index-poc-report
          path: wave-index-output/report.json
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner build tools
        run: |
          command -v cc make clang bison flex pkg-config
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache pgrx CLI
        id: pgrx-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-pgrx
          key: pgrx-cli-${{ runner.os }}-rust-1.91.1-pgrx-0.16.1-debug
      - name: Cache Rust build inputs and artifacts
        id: rust-build-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pg17-${{ runner.os }}-rust-1.91.1-${{ hashFiles('Cargo.lock') }}
      - name: Install matching pgrx CLI
        if: steps.pgrx-cli.outputs.cache-hit != 'true'
        run: cargo install cargo-pgrx --version 0.16.1 --locked --debug
      - name: Save compiled CLI before running tests
        if: steps.pgrx-cli.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/bin/cargo-pgrx
          key: pgrx-cli-${{ runner.os }}-rust-1.91.1-pgrx-0.16.1-debug
      - name: Cache user-owned PostgreSQL build
        id: postgres-build
        uses: actions/cache@v4
        with:
          path: ~/.pgrx
          key: pgrx-managed-${{ runner.os }}-pgrx-0.16.1-pg17-minimal-v1
      - name: Configure user-owned PostgreSQL
        if: steps.postgres-build.outputs.cache-hit != 'true'
        run: cargo pgrx init --pg17 download --configure-flag=--without-icu --configure-flag=--without-readline --configure-flag=--without-zlib
      - name: Run extension integration tests
        working-directory: extensions/pg_morlet
        run: cargo pgrx test pg17
      - name: Preserve compilation cache even when tests fail
        if: always() && steps.rust-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pg17-${{ runner.os }}-rust-1.91.1-${{ hashFiles('Cargo.lock') }}
      - uses: actions/setup-python@v5
        if: github.event_name == 'pull_request'
        with:
          python-version: '3.12'
      - name: Install benchmark dependencies
        if: github.event_name == 'pull_request'
        run: python -m pip install -r benchmarks/requirements.txt
      - name: Test Parquet input contracts
        if: github.event_name == 'pull_request'
        run: python -m unittest discover -s tools/ingest -p 'test_*.py'
      - name: Test viewer helpers
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install -r tools/viewer/requirements.txt
          python -m unittest discover -s tools/viewer -p 'test_*.py'
      - name: Cache optimized benchmark build
        if: github.event_name == 'pull_request'
        uses: actions/cache@v4
        with:
          path: target/release
          key: benchmark-release-${{ runner.os }}-rust-1.91.1-${{ hashFiles('Cargo.lock') }}
      - name: Start benchmark database
        if: github.event_name == 'pull_request'
        working-directory: extensions/pg_morlet
        run: |
          PG_CONFIG_PATH=$(python -c 'import pathlib,tomllib; print(tomllib.loads((pathlib.Path.home()/".pgrx/config.toml").read_text())["configs"]["pg17"])')
          cargo pgrx install --release --pg-config "$PG_CONFIG_PATH"
          cargo pgrx start pg17
      - name: Run bounded benchmark smoke test
        if: github.event_name == 'pull_request'
        env:
          PGHOST: localhost
          PGPORT: '28817'
          PGDATABASE: postgres
          PGUSER: runner
          MORLET_BUILD_PROFILE: release
        run: |
          export PGDATABASE="morlet_benchmark_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          python -c 'import os,psycopg; from psycopg import sql; c=psycopg.connect(dbname="postgres",autocommit=True); c.execute(sql.SQL("CREATE DATABASE {}").format(sql.Identifier(os.environ["PGDATABASE"]))); c.close()'
          python -c 'import psycopg; c=psycopg.connect(autocommit=True); c.execute("CREATE EXTENSION pg_morlet"); c.close()'
          python benchmarks/run.py --rows 32 --samples 2048 --repeats 10 --output benchmark-output
          python examples/inspect_recordings.py
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && success()
        with:
          name: benchmark-smoke-report
          path: |
            benchmark-output/report.json
  postgres-pgvector:
    # The probe-search tests skip when pgvector is absent (the job above keeps proving that
    # pg_morlet installs and passes without it). Here pgvector is built into the pgrx-managed
    # PostgreSQL first, so those tests must run. Separate cache key: the plain job's
    # PostgreSQL must never contain pgvector.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache pgrx CLI
        id: pgrx-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-pgrx
          key: pgrx-cli-${{ runner.os }}-rust-1.91.1-pgrx-0.16.1-debug
      - name: Cache Rust build inputs and artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pg17-${{ runner.os }}-rust-1.91.1-${{ hashFiles('Cargo.lock') }}
      - name: Install matching pgrx CLI
        if: steps.pgrx-cli.outputs.cache-hit != 'true'
        run: cargo install cargo-pgrx --version 0.16.1 --locked --debug
      - name: Cache user-owned PostgreSQL build with pgvector
        id: postgres-build
        uses: actions/cache@v4
        with:
          path: ~/.pgrx
          key: pgrx-managed-${{ runner.os }}-pgrx-0.16.1-pg17-minimal-pgvector-0.8.0-v1
      - name: Configure user-owned PostgreSQL
        if: steps.postgres-build.outputs.cache-hit != 'true'
        run: cargo pgrx init --pg17 download --configure-flag=--without-icu --configure-flag=--without-readline --configure-flag=--without-zlib
      - name: Build pgvector 0.8.0 into it
        if: steps.postgres-build.outputs.cache-hit != 'true'
        run: |
          PG_CONFIG_PATH=$(python3 -c 'import pathlib,tomllib; print(tomllib.loads((pathlib.Path.home()/".pgrx/config.toml").read_text())["configs"]["pg17"])')
          git clone --depth 1 --branch v0.8.0 https://github.com/pgvector/pgvector.git "$RUNNER_TEMP/pgvector"
          make -C "$RUNNER_TEMP/pgvector" PG_CONFIG="$PG_CONFIG_PATH"
          make -C "$RUNNER_TEMP/pgvector" install PG_CONFIG="$PG_CONFIG_PATH"
      - name: Require pgvector, so probe-search tests cannot skip
        run: |
          PG_CONFIG_PATH=$(python3 -c 'import pathlib,tomllib; print(tomllib.loads((pathlib.Path.home()/".pgrx/config.toml").read_text())["configs"]["pg17"])')
          test -f "$("$PG_CONFIG_PATH" --sharedir)/extension/vector.control"
      - name: Run extension integration tests with pgvector
        working-directory: extensions/pg_morlet
        run: cargo pgrx test pg17
  upgrade:
    # Populates a database with the previous release's extension, then updates it
    # in place to this branch (extensions/pg_morlet/tests/upgrade.sh).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the previous release tags
        run: |
          git fetch --no-tags --depth=1 origin +refs/tags/v0.1.0-alpha.3:refs/tags/v0.1.0-alpha.3
          git fetch --no-tags --depth=1 origin +refs/tags/v0.2.0-alpha.1:refs/tags/v0.2.0-alpha.1
          git fetch --no-tags --depth=1 origin +refs/tags/v0.3.0-alpha.1:refs/tags/v0.3.0-alpha.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache pgrx CLI
        id: pgrx-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-pgrx
          key: pgrx-cli-${{ runner.os }}-rust-1.91.1-pgrx-0.16.1-debug
      - name: Install matching pgrx CLI
        if: steps.pgrx-cli.outputs.cache-hit != 'true'
        run: cargo install cargo-pgrx --version 0.16.1 --locked --debug
      - name: Cache user-owned PostgreSQL build
        id: postgres-build
        uses: actions/cache@v4
        with:
          path: ~/.pgrx
          key: pgrx-managed-${{ runner.os }}-pgrx-0.16.1-pg17-minimal-v1
      - name: Configure user-owned PostgreSQL
        if: steps.postgres-build.outputs.cache-hit != 'true'
        run: cargo pgrx init --pg17 download --configure-flag=--without-icu --configure-flag=--without-readline --configure-flag=--without-zlib
      - name: Upgrade a populated database from v0.1.0-alpha.3
        run: |
          export PG_CONFIG=$(python3 -c 'import pathlib,tomllib; print(tomllib.loads((pathlib.Path.home()/".pgrx/config.toml").read_text())["configs"]["pg17"])')
          extensions/pg_morlet/tests/upgrade.sh v0.1.0-alpha.3
      - name: Upgrade a populated database from v0.2.0-alpha.1
        run: |
          export PG_CONFIG=$(python3 -c 'import pathlib,tomllib; print(tomllib.loads((pathlib.Path.home()/".pgrx/config.toml").read_text())["configs"]["pg17"])')
          extensions/pg_morlet/tests/upgrade_from_release.sh v0.2.0-alpha.1 0.2.0
      - name: Upgrade a populated database from v0.3.0-alpha.1
        run: |
          export PG_CONFIG=$(python3 -c 'import pathlib,tomllib; print(tomllib.loads((pathlib.Path.home()/".pgrx/config.toml").read_text())["configs"]["pg17"])')
          extensions/pg_morlet/tests/upgrade_from_release.sh v0.3.0-alpha.1 0.3.0
  seismic-example:
    # Synthetic contract tests for examples/seismic against a fresh extension
    # install. No public services or downloads beyond pinned packages.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache pgrx CLI
        id: pgrx-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-pgrx
          key: pgrx-cli-${{ runner.os }}-rust-1.91.1-pgrx-0.16.1-debug
      - name: Cache Rust build inputs and artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: seismic-${{ runner.os }}-rust-1.91.1-${{ hashFiles('Cargo.lock') }}
      - name: Install matching pgrx CLI
        if: steps.pgrx-cli.outputs.cache-hit != 'true'
        run: cargo install cargo-pgrx --version 0.16.1 --locked --debug
      - name: Cache user-owned PostgreSQL build
        id: postgres-build
        uses: actions/cache@v4
        with:
          path: ~/.pgrx
          key: pgrx-managed-${{ runner.os }}-pgrx-0.16.1-pg17-minimal-v1
      - name: Configure user-owned PostgreSQL
        if: steps.postgres-build.outputs.cache-hit != 'true'
        run: cargo pgrx init --pg17 download --configure-flag=--without-icu --configure-flag=--without-readline --configure-flag=--without-zlib
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install this branch's extension and start PostgreSQL
        working-directory: extensions/pg_morlet
        run: |
          PG_CONFIG_PATH=$(python -c 'import pathlib,tomllib; print(tomllib.loads((pathlib.Path.home()/".pgrx/config.toml").read_text())["configs"]["pg17"])')
          cargo pgrx install --release --pg-config "$PG_CONFIG_PATH"
          cargo pgrx start pg17
      - name: Build the Rust features adapter used by temporal retrieval
        run: cargo build --locked --release -p morlet-core --example features
      - name: Install example dependencies
        run: python -m pip install -r examples/seismic/requirements.txt
      - name: Offline, database and regression tests (skips are failures)
        working-directory: examples/seismic/tests
        env:
          MORLET_SEISMIC_TEST_DSN: postgresql://runner@localhost:28817/postgres
          MORLET_SEISMIC_REQUIRE_DB: '1'
          MORLET_SEISMIC_REQUIRE_FEATURES: '1'
        run: |
          python -m unittest -v test_offline test_ingest_db test_review_regressions 2>&1 | tee unittest.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -q -E "skipped|OK \(skipped" unittest.log; then echo "::error::seismic tests were skipped"; exit 1; fi

