name: Rust
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # One run per pull request: a new push cancels the superseded run. Runs on main are never cancelled.
  group: rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    # Docs-only changes skip the build and test jobs below. A job skipped by its `if` reports success, so
    # the required checks (core, postgres, seismic-example) still pass; the `postgres` gate fails if this
    # classification itself fails. Docs-only = every changed path is Markdown, docs/, research/, assets/ or
    # LICENSE, or evaluation results (evaluation/*/results/*, *.json, *.log under evaluation/). Anything else,
    # or a diff that cannot be computed, runs everything. python-sdk and seismic-example additionally run only
    # when their own inputs (or the extension, the core crate, the lock file or this workflow) change.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      sdk: ${{ steps.classify.outputs.sdk }}
      seismic: ${{ steps.classify.outputs.seismic }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          code=true; sdk=true; seismic=true
          files=""
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only "$PR_BASE...$PR_HEAD") || files=""
          elif [ "$EVENT" = push ] && [ -n "$PUSH_BEFORE" ] && [ "${PUSH_BEFORE//0/}" != "" ]; then
            files=$(git diff --name-only "$PUSH_BEFORE" "$PUSH_AFTER") || files=""
          fi
          if [ -n "$files" ]; then
            code=false; sdk=false; seismic=false
            while IFS= read -r f; do
              case "$f" in
                *.md|docs/*|research/*|assets/*|LICENSE) continue ;;
                evaluation/*/results/*|evaluation/*.json|evaluation/*.log) continue ;;
              esac
              [ "$code" = true ] || echo "code change: $f"
              code=true
              case "$f" in
                extensions/*|crates/*|Cargo.lock|Cargo.toml|rust-toolchain.toml|.github/*) sdk=true; seismic=true ;;
                sdk/*) sdk=true ;;
                examples/seismic/*|tools/*) seismic=true ;;
              esac
            done <<< "$files"
          fi
          { echo "code=$code"; echo "sdk=$sdk"; echo "seismic=$seismic"; } >> "$GITHUB_OUTPUT"
          echo "changed files: $(printf '%s\n' "$files" | grep -c . || true); build and tests: $code; python-sdk: $sdk; seismic-example: $seismic"
  lint:
    # Formatting only, without a build: reports in seconds. core repeats the check, so this job need not
    # be a required check.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - run: cargo fmt --all -- --check
  core:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Rust build inputs and artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: core-${{ runner.os }}-rust-1.91.1-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p morlet-core
      - run: cargo clippy --locked -p morlet-core --all-targets -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: evaluation/requirements.txt
      - run: python -m pip install -r evaluation/requirements.txt
      - run: cargo build --locked --release -p morlet-core --example features
      - run: python -m unittest discover -s evaluation -p 'test_*.py'
      - name: Wave-index candidate recall and temporal-control report
        run: python evaluation/wave_index.py --size 128 --output wave-index-output/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: wave-index-poc-report
          path: wave-index-output/report.json
  compat:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # PostgreSQL compatibility matrix (docs/compatibility.md): every #[pg_test] per PostgreSQL major,
    # once without pgvector (probe search is optional and must fail clearly) and once with a pinned
    # pgvector (the probe tests must run: ci_local.sh fails if pgvector is missing). Minor versions
    # are pinned; cargo pgrx init fails the job when upstream has moved on, so bumps are explicit.
    # PostgreSQL 17 is the reference; the paper results stay on the frozen PostgreSQL 17 build.
    name: pg${{ matrix.pg }} ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {pg: 17, pg-minor: '17.11', mode: without-pgvector, pgvector: none, pgvector-commit: '', experimental: false}
          - {pg: 17, pg-minor: '17.11', mode: with-pgvector, pgvector: v0.8.0, pgvector-commit: 2627c5ff775ae6d7aef0c430121ccf857842d2f2, experimental: false}
          - {pg: 18, pg-minor: '18.6', mode: without-pgvector, pgvector: none, pgvector-commit: '', experimental: false}
          - {pg: 18, pg-minor: '18.6', mode: with-pgvector, pgvector: v0.8.7, pgvector-commit: f37c13f68b57d2c3472b2214fbcff699d6d34876, experimental: false}
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner build tools
        run: command -v cc make clang bison flex pkg-config
      - name: PostgreSQL ${{ matrix.pg-minor }}, pgvector ${{ matrix.pgvector }}
        id: pg
        uses: ./.github/actions/pgrx-postgres
        with:
          pg-minor: ${{ matrix.pg-minor }}
          pgvector: ${{ matrix.pgvector }}
          pgvector-commit: ${{ matrix.pgvector-commit }}
      - name: Restore Rust build cache
        id: rust-build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # pgvector does not change what is compiled, so both modes share one build cache
          key: pg${{ matrix.pg }}-${{ runner.os }}-${{ runner.arch }}-rust-${{ steps.pg.outputs.rust }}-pgrx-${{ steps.pg.outputs.pgrx }}-${{ hashFiles('Cargo.lock') }}
      - name: Extension tests (pg${{ matrix.pg }}, ${{ matrix.mode }})
        run: extensions/pg_morlet/tests/ci_local.sh ${{ matrix.pg }} ${{ matrix.mode }}
      - name: Save Rust build cache even when tests fail
        if: always() && steps.rust-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-build-cache.outputs.cache-primary-key }}
      # Tool tests and the bounded benchmark smoke run once, on the reference configuration.
      - uses: actions/setup-python@v5
        if: github.event_name == 'pull_request' && matrix.pg == 17 && matrix.mode == 'without-pgvector'
        with:
          python-version: '3.12'
      - name: Install benchmark dependencies
        if: github.event_name == 'pull_request' && matrix.pg == 17 && matrix.mode == 'without-pgvector'
        run: python -m pip install -r benchmarks/requirements.txt
      - name: Test importers (Parquet, exchange, WAV, EDF, CSV, TDMS)
        if: github.event_name == 'pull_request' && matrix.pg == 17 && matrix.mode == 'without-pgvector'
        run: |
          python -m pip install -r tools/ingest/requirements.txt
          python -m unittest discover -s tools/ingest -p 'test_*.py'
      - name: Test the MCP server (no database)
        if: github.event_name == 'pull_request' && matrix.pg == 17 && matrix.mode == 'without-pgvector'
        run: |
          python -m pip install -r tools/mcp/requirements.txt
          python -m unittest discover -s tools/mcp -p 'test_*.py'
      - name: Test the memory policy engine (no database)
        if: github.event_name == 'pull_request' && matrix.pg == 17 && matrix.mode == 'without-pgvector'
        run: python -m unittest discover -s tools/memory -p 'test_*.py'
      - name: Test the MQTT collector contract (no broker)
        if: github.event_name == 'pull_request' && matrix.pg == 17 && matrix.mode == 'without-pgvector'
        run: python -m unittest discover -s examples/collectors/mqtt -p 'test_*.py'
      - name: Test viewer helpers
        if: github.event_name == 'pull_request' && matrix.pg == 17 && matrix.mode == 'without-pgvector'
        run: |
          python -m pip install -r tools/viewer/requirements.txt
          python -m unittest discover -s tools/viewer -p 'test_*.py'
      - name: Cache optimized benchmark build
        if: github.event_name == 'pull_request' && matrix.pg == 17 && matrix.mode == 'without-pgvector'
        uses: actions/cache@v4
        with:
          path: target/release
          key: benchmark-release-${{ runner.os }}-rust-${{ steps.pg.outputs.rust }}-${{ hashFiles('Cargo.lock') }}
      - name: Start benchmark database
        if: github.event_name == 'pull_request' && matrix.pg == 17 && matrix.mode == 'without-pgvector'
        working-directory: extensions/pg_morlet
        run: |
          cargo pgrx install --release --pg-config "$PG_CONFIG"
          cargo pgrx start pg17
      - name: Run bounded benchmark smoke test
        if: github.event_name == 'pull_request' && matrix.pg == 17 && matrix.mode == 'without-pgvector'
        env:
          PGHOST: localhost
          PGPORT: '28817'
          PGDATABASE: postgres
          PGUSER: runner
          MORLET_BUILD_PROFILE: release
        run: |
          export PGDATABASE="morlet_benchmark_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          python -c 'import os,psycopg; from psycopg import sql; c=psycopg.connect(dbname="postgres",autocommit=True); c.execute(sql.SQL("CREATE DATABASE {}").format(sql.Identifier(os.environ["PGDATABASE"]))); c.close()'
          python -c 'import psycopg; c=psycopg.connect(autocommit=True); c.execute("CREATE EXTENSION pg_morlet"); c.close()'
          python benchmarks/run.py --rows 32 --samples 2048 --repeats 10 --output benchmark-output
          python examples/inspect_recordings.py
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && matrix.pg == 17 && matrix.mode == 'without-pgvector' && success()
        with:
          name: benchmark-smoke-report
          path: |
            benchmark-output/report.json
  postgres:
    # The required status check: passes only when every non-experimental compat entry passed, or when the
    # change is docs-only. Fails if the change classification itself failed.
    if: always()
    needs: [changes, compat]
    runs-on: ubuntu-24.04
    steps:
      - name: All required PostgreSQL compatibility jobs passed (or docs-only change)
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          COMPAT: ${{ needs.compat.result }}
        run: |
          test "$CHANGES" = success || { echo "change classification failed"; exit 1; }
          if [ "$CODE" = false ]; then echo "docs-only change: PostgreSQL jobs skipped"; exit 0; fi
          test "$COMPAT" = success
  upgrade:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Populates databases with the previous releases' extension, then updates them in place to this
    # branch (tests/upgrade.sh, tests/upgrade_from_release.sh). PostgreSQL 17 only: those releases
    # were built for PostgreSQL 17 only.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the previous release tags
        run: |
          git fetch --no-tags --depth=1 origin +refs/tags/v0.1.0-alpha.3:refs/tags/v0.1.0-alpha.3
          git fetch --no-tags --depth=1 origin +refs/tags/v0.2.0-alpha.1:refs/tags/v0.2.0-alpha.1
          git fetch --no-tags --depth=1 origin +refs/tags/v0.3.0-alpha.1:refs/tags/v0.3.0-alpha.1
          git fetch --no-tags --depth=1 origin +refs/tags/v0.3.1-alpha.1:refs/tags/v0.3.1-alpha.1
          git fetch --no-tags --depth=1 origin +refs/tags/v0.3.3-alpha.1:refs/tags/v0.3.3-alpha.1
          git fetch --no-tags --depth=1 origin +refs/tags/v0.3.5-alpha.1:refs/tags/v0.3.5-alpha.1
          git fetch --no-tags --depth=1 origin +refs/tags/v0.3.6-alpha.1:refs/tags/v0.3.6-alpha.1
      - name: PostgreSQL 17.11
        id: pg
        uses: ./.github/actions/pgrx-postgres
        with:
          pg-minor: '17.11'
      - name: Cache Rust build of this branch
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: upgrade-${{ runner.os }}-rust-${{ steps.pg.outputs.rust }}-${{ hashFiles('Cargo.lock') }}
      - name: Cache packaged builds of the released refs (they never change)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/upgrade-releases
          key: upgrade-releases-${{ runner.os }}-${{ runner.arch }}-pg17.11-pgrx-${{ steps.pg.outputs.pgrx }}-${{ hashFiles('extensions/pg_morlet/tests/ci_local.sh') }}
      - name: The 0.3.4 -> 0.3.5 update script is generated from the current sources
        if: hashFiles('extensions/pg_morlet/sql/pg_morlet--0.3.4--0.3.5.sql') != ''
        working-directory: extensions/pg_morlet
        run: |
          if grep -q "^default_version = '0.3.5'" pg_morlet.control; then
            cargo pgrx schema pg17 --pg-config "$PG_CONFIG" -o "$RUNNER_TEMP/new.sql"
            python3 tests/gen_upgrade.py "$RUNNER_TEMP/new.sql" --check
          fi
      - name: Upgrade populated databases from v0.1.0-alpha.3, v0.2.0-alpha.1, v0.3.0-alpha.1, v0.3.1-alpha.1, v0.3.3-alpha.1, v0.3.5-alpha.1 and v0.3.6-alpha.1
        env:
          MORLET_UPGRADE_CACHE: ${{ runner.temp }}/upgrade-releases
        run: extensions/pg_morlet/tests/ci_local.sh 17 upgrade
  seismic-example:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.seismic == 'true'
    # Synthetic contract tests for examples/seismic against a fresh extension
    # install. No public services or downloads beyond pinned packages.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 17.11
        uses: ./.github/actions/pgrx-postgres
        with:
          pg-minor: '17.11'
      - name: Cache Rust build inputs and artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: seismic-${{ runner.os }}-rust-1.91.1-${{ hashFiles('Cargo.lock') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install this branch's extension and start PostgreSQL
        working-directory: extensions/pg_morlet
        run: |
          cargo pgrx install --release --pg-config "$PG_CONFIG"
          cargo pgrx start pg17
      - name: Build the Rust features adapter used by temporal retrieval
        run: cargo build --locked --release -p morlet-core --example features
      - name: Install example dependencies
        run: python -m pip install -r examples/seismic/requirements.txt
      - name: Offline, database and regression tests (skips are failures)
        working-directory: examples/seismic/tests
        env:
          MORLET_SEISMIC_TEST_DSN: postgresql://runner@localhost:28817/postgres
          MORLET_SEISMIC_REQUIRE_DB: '1'
          MORLET_SEISMIC_REQUIRE_FEATURES: '1'
        run: |
          python -m unittest -v test_offline test_ingest_db test_review_regressions 2>&1 | tee unittest.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -q -E "skipped|OK \(skipped" unittest.log; then echo "::error::seismic tests were skipped"; exit 1; fi

  python-sdk:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.sdk == 'true'
    # Builds and installs the Python SDK wheel, runs its contract tests against this branch's extension
    # (skips are failures) and runs the quickstart example. No downloads beyond pinned packages.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 17.11
        uses: ./.github/actions/pgrx-postgres
        with:
          pg-minor: '17.11'
      - name: Cache Rust build inputs and artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: python-sdk-${{ runner.os }}-rust-1.91.1-${{ hashFiles('Cargo.lock') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install this branch's extension and start PostgreSQL
        working-directory: extensions/pg_morlet
        run: |
          cargo pgrx install --release --pg-config "$PG_CONFIG"
          cargo pgrx start pg17
      - name: Build and install the SDK wheel
        run: |
          python -m pip install build==1.2.2.post1 matplotlib==3.9.2
          python -m build sdk/python --outdir sdk-dist
          python -m pip install sdk-dist/*.whl
      - name: SDK tests against the installed wheel (skips are failures)
        working-directory: sdk/python/tests
        env:
          MORLET_SDK_TEST_DSN: postgresql://runner@localhost:28817/postgres
          MORLET_SDK_REQUIRE_DB: '1'
        run: |
          python -c 'import morletdb, sys; assert "site-packages" in morletdb.__file__, morletdb.__file__'
          python -m unittest -v test_offline test_integration 2>&1 | tee unittest.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -q -E "skipped '(set MORLET|server without)" unittest.log; then echo "::error::SDK tests were skipped"; exit 1; fi
      - name: Quickstart example
        env:
          DATABASE_URL: postgresql://runner@localhost:28817/postgres
        run: |
          python examples/python/quickstart.py quickstart.png | tee quickstart.log
          test -s quickstart.png
          test "$(grep -E '^ +[1-4] ' quickstart.log | grep -c 'impact at')" -eq 4
