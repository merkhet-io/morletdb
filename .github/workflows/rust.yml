name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p morlet-core
      - run: cargo clippy --locked -p morlet-core --all-targets -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r evaluation/requirements.txt
      - run: cargo build --locked --release -p morlet-core --example features
      - run: python -m unittest discover -s evaluation -p 'test_*.py'
      - name: Wave-index candidate recall and temporal-control report
        run: python evaluation/wave_index.py --size 128 --output wave-index-output/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: wave-index-poc-report
          path: wave-index-output/report.json
  compat:
    # PostgreSQL compatibility matrix (docs/compatibility.md): every #[pg_test] per PostgreSQL major,
    # once without pgvector (probe search is optional and must fail clearly) and once with a pinned
    # pgvector (the probe tests must run: ci_local.sh fails if pgvector is missing). Minor versions
    # are pinned; cargo pgrx init fails the job when upstream has moved on, so bumps are explicit.
    # PostgreSQL 17 is the reference; the paper results stay on the frozen PostgreSQL 17 build.
    name: pg${{ matrix.pg }} ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {pg: 17, pg-minor: '17.11', mode: without-pgvector, pgvector: none, pgvector-commit: '', experimental: false}
          - {pg: 17, pg-minor: '17.11', mode: with-pgvector, pgvector: v0.8.0, pgvector-commit: 2627c5ff775ae6d7aef0c430121ccf857842d2f2, experimental: false}
          - {pg: 18, pg-minor: '18.6', mode: without-pgvector, pgvector: none, pgvector-commit: '', experimental: false}
          - {pg: 18, pg-minor: '18.6', mode: with-pgvector, pgvector: v0.8.7, pgvector-commit: f37c13f68b57d2c3472b2214fbcff699d6d34876, experimental: false}
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner build tools
        run: command -v cc make clang bison flex pkg-config
      - name: PostgreSQL ${{ matrix.pg-minor }}, pgvector ${{ matrix.pgvector }}
        id: pg
        uses: ./.github/actions/pgrx-postgres
        with:
          pg-minor: ${{ matrix.pg-minor }}
          pgvector: ${{ matrix.pgvector }}
          pgvector-commit: ${{ matrix.pgvector-commit }}
      - name: Restore Rust build cache
        id: rust-build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # pgvector does not change what is compiled, so both modes share one build cache
          key: pg${{ matrix.pg }}-${{ runner.os }}-${{ runner.arch }}-rust-${{ steps.pg.outputs.rust }}-pgrx-${{ steps.pg.outputs.pgrx }}-${{ hashFiles('Cargo.lock') }}
      - name: Extension tests (pg${{ matrix.pg }}, ${{ matrix.mode }})
        run: extensions/pg_morlet/tests/ci_local.sh ${{ matrix.pg }} ${{ matrix.mode }}
      - name: Save Rust build cache even when tests fail
        if: always() && steps.rust-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-build-cache.outputs.cache-primary-key }}
      # Tool tests and the bounded benchmark smoke run once, on the reference configuration.
      - uses: actions/setup-python@v5
        if: github.event_name == 'pull_request' && matrix.pg == 17 && matrix.mode == 'without-pgvector'
        with:
          python-version: '3.12'
      - name: Install benchmark dependencies
        if: github.event_name == 'pull_request' && matrix.pg == 17 && matrix.mode == 'without-pgvector'
        run: python -m pip install -r benchmarks/requirements.txt
      - name: Test Parquet input contracts
        if: github.event_name == 'pull_request' && matrix.pg == 17 && matrix.mode == 'without-pgvector'
        run: python -m unittest discover -s tools/ingest -p 'test_*.py'
      - name: Test viewer helpers
        if: github.event_name == 'pull_request' && matrix.pg == 17 && matrix.mode == 'without-pgvector'
        run: |
          python -m pip install -r tools/viewer/requirements.txt
          python -m unittest discover -s tools/viewer -p 'test_*.py'
      - name: Cache optimized benchmark build
        if: github.event_name == 'pull_request' && matrix.pg == 17 && matrix.mode == 'without-pgvector'
        uses: actions/cache@v4
        with:
          path: target/release
          key: benchmark-release-${{ runner.os }}-rust-${{ steps.pg.outputs.rust }}-${{ hashFiles('Cargo.lock') }}
      - name: Start benchmark database
        if: github.event_name == 'pull_request' && matrix.pg == 17 && matrix.mode == 'without-pgvector'
        working-directory: extensions/pg_morlet
        run: |
          cargo pgrx install --release --pg-config "$PG_CONFIG"
          cargo pgrx start pg17
      - name: Run bounded benchmark smoke test
        if: github.event_name == 'pull_request' && matrix.pg == 17 && matrix.mode == 'without-pgvector'
        env:
          PGHOST: localhost
          PGPORT: '28817'
          PGDATABASE: postgres
          PGUSER: runner
          MORLET_BUILD_PROFILE: release
        run: |
          export PGDATABASE="morlet_benchmark_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          python -c 'import os,psycopg; from psycopg import sql; c=psycopg.connect(dbname="postgres",autocommit=True); c.execute(sql.SQL("CREATE DATABASE {}").format(sql.Identifier(os.environ["PGDATABASE"]))); c.close()'
          python -c 'import psycopg; c=psycopg.connect(autocommit=True); c.execute("CREATE EXTENSION pg_morlet"); c.close()'
          python benchmarks/run.py --rows 32 --samples 2048 --repeats 10 --output benchmark-output
          python examples/inspect_recordings.py
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && matrix.pg == 17 && matrix.mode == 'without-pgvector' && success()
        with:
          name: benchmark-smoke-report
          path: |
            benchmark-output/report.json
  postgres:
    # The required status check: passes only when every non-experimental compat entry passed.
    if: always()
    needs: compat
    runs-on: ubuntu-24.04
    steps:
      - name: All required PostgreSQL compatibility jobs passed
        run: test "${{ needs.compat.result }}" = success
  upgrade:
    # Populates databases with the previous releases' extension, then updates them in place to this
    # branch (tests/upgrade.sh, tests/upgrade_from_release.sh). PostgreSQL 17 only: those releases
    # were built for PostgreSQL 17 only.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the previous release tags
        run: |
          git fetch --no-tags --depth=1 origin +refs/tags/v0.1.0-alpha.3:refs/tags/v0.1.0-alpha.3
          git fetch --no-tags --depth=1 origin +refs/tags/v0.2.0-alpha.1:refs/tags/v0.2.0-alpha.1
          git fetch --no-tags --depth=1 origin +refs/tags/v0.3.0-alpha.1:refs/tags/v0.3.0-alpha.1
      - name: PostgreSQL 17.11
        uses: ./.github/actions/pgrx-postgres
        with:
          pg-minor: '17.11'
      - name: Upgrade populated databases from v0.1.0-alpha.3, v0.2.0-alpha.1 and v0.3.0-alpha.1
        run: extensions/pg_morlet/tests/ci_local.sh 17 upgrade
  seismic-example:
    # Synthetic contract tests for examples/seismic against a fresh extension
    # install. No public services or downloads beyond pinned packages.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 17.11
        uses: ./.github/actions/pgrx-postgres
        with:
          pg-minor: '17.11'
      - name: Cache Rust build inputs and artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: seismic-${{ runner.os }}-rust-1.91.1-${{ hashFiles('Cargo.lock') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install this branch's extension and start PostgreSQL
        working-directory: extensions/pg_morlet
        run: |
          cargo pgrx install --release --pg-config "$PG_CONFIG"
          cargo pgrx start pg17
      - name: Build the Rust features adapter used by temporal retrieval
        run: cargo build --locked --release -p morlet-core --example features
      - name: Install example dependencies
        run: python -m pip install -r examples/seismic/requirements.txt
      - name: Offline, database and regression tests (skips are failures)
        working-directory: examples/seismic/tests
        env:
          MORLET_SEISMIC_TEST_DSN: postgresql://runner@localhost:28817/postgres
          MORLET_SEISMIC_REQUIRE_DB: '1'
          MORLET_SEISMIC_REQUIRE_FEATURES: '1'
        run: |
          python -m unittest -v test_offline test_ingest_db test_review_regressions 2>&1 | tee unittest.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -q -E "skipped|OK \(skipped" unittest.log; then echo "::error::seismic tests were skipped"; exit 1; fi

