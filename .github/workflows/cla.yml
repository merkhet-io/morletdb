# Contributor License Agreement (docs/cla.md): every commit of a pull request from an outside contributor must be
# signed off (a "Signed-off-by:" line, `git commit -s`). Pull requests opened by the repository's owners and members
# pass without the check; their commits are Merkhet's own.
name: cla
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
  pull-requests: read
jobs:
  sign-off:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every commit signed off (outside contributors)
        env:
          GH_TOKEN: ${{ github.token }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          case "$ASSOCIATION" in
            OWNER|MEMBER) echo "opened by the repository's $ASSOCIATION: no CLA check needed"; exit 0 ;;
          esac
          missing=$(gh api --paginate "repos/$REPO/pulls/$PR/commits" \
            --jq '.[] | select((.commit.message | test("(?m)^Signed-off-by: .+ <.+>$")) | not) | .sha[0:12] + " " + (.commit.message | split("\n")[0])')
          if [ -n "$missing" ]; then
            echo "::error::These commits are not signed off. Agree to the Contributor License Agreement (docs/cla.md) by signing off each commit (git commit -s, or git rebase --signoff):"
            echo "$missing"
            exit 1
          fi
          echo "every commit is signed off"
