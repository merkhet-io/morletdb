name: Recording preview
on:
  pull_request:
    paths:
      - 'deploy/**'
      - 'compose.yaml'
      - '.dockerignore'
      - 'crates/**'
      - 'extensions/**'
      - 'tools/**'
      - 'evaluation/**'
      - 'examples/inspect_recordings.py'
      - 'examples/notebooks/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - '.github/workflows/preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  walkthrough:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned preview environment
        run: docker compose build db
      - name: Import, search, inspect and replay
        run: docker compose run --rm walkthrough
      - name: Restart with preserved recordings and repeat
        run: |
          docker compose restart db
          docker compose up -d --wait db
          docker compose run --rm walkthrough
      - name: Execute visual notebook twice and export HTML
        run: |
          mkdir -p notebook-output
          chmod 777 notebook-output
          docker compose run --rm -v "$PWD/notebook-output:/reports" walkthrough sh -c '
            pip install --no-cache-dir -r examples/notebooks/requirements.txt &&
            python -m ipykernel install --sys-prefix --name python3 &&
            jupyter nbconvert --to notebook --execute examples/notebooks/waveform-investigation.ipynb --output first-run.ipynb --output-dir /reports --ExecutePreprocessor.timeout=180 &&
            jupyter nbconvert --to notebook --execute examples/notebooks/waveform-investigation.ipynb --output executed.ipynb --output-dir /reports --ExecutePreprocessor.timeout=180 &&
            jupyter nbconvert --to html /reports/executed.ipynb --output investigation.html --output-dir /reports'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-notebook
          path: notebook-output/
          if-no-files-found: ignore
      - name: Exact-search budget and ranking smoke above 4096 candidates
        run: |
          mkdir -p benchmark-output
          docker compose run --rm -v "$PWD/benchmark-output:/reports" walkthrough sh -c 'pip install --no-cache-dir -r evaluation/requirements.txt && python evaluation/scale.py --sizes 10000 --repeats 3 --output /reports/scale-smoke.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-search-scale-smoke
          path: benchmark-output/scale-smoke.json
          if-no-files-found: ignore
      - name: Diagnostics
        if: failure()
        run: docker compose logs db
      - name: Tear down disposable CI database
        if: always()
        run: docker compose down -v
