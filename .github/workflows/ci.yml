name: Legacy Go
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/server/**'
      - 'testdata/morlet-energy-v1/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'apps/server/**'
      - 'testdata/morlet-energy-v1/**'
      - '.github/workflows/ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/morletdb

