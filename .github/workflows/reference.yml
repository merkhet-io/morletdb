name: Numerical reference
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/reference-go/**'
      - 'testdata/morlet-energy-v1/**'
      - '.github/workflows/reference.yml'
      - 'Makefile'
  pull_request:
    paths:
      - 'tools/reference-go/**'
      - 'testdata/morlet-energy-v1/**'
      - '.github/workflows/reference.yml'
      - 'Makefile'
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/reference-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/reference-go/go.mod
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build reference generator without changing frozen fixtures
        run: go build -o "$RUNNER_TEMP/morlet-golden" ./cmd/golden
