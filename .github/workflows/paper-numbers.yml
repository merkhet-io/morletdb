name: paper-numbers
# Fails when the report's generated numbers or tables are stale relative to the stored results, or when the
# website copies of the report PDFs differ from the canonical ones in research/paper/.
# Standard library only; runs no benchmark and needs no database.
on:
  pull_request:
    paths: ["research/paper/**", "research/paper2/*.pdf", "research/paper3/*.pdf", "evaluation/consolidated/**", "evaluation/industrial_iu1/**", "evaluation/industrial_iu2/**", "evaluation/analysis_io.py", "docs/morletdb*.pdf", "docs/*.html", "docs/CNAME", "docs/robots.txt", "docs/sitemap.xml", "tools/site_seo.py", "README.md", "VERSION", "tools/site_versions.py", "tools/highlight_site.py", ".github/workflows/paper-numbers.yml"]
  push:
    branches: [main]
    paths: ["research/paper/**", "research/paper2/*.pdf", "research/paper3/*.pdf", "evaluation/consolidated/**", "evaluation/industrial_iu1/**", "evaluation/industrial_iu2/**", "evaluation/analysis_io.py", "docs/morletdb*.pdf", "docs/*.html", "docs/CNAME", "docs/robots.txt", "docs/sitemap.xml", "tools/site_seo.py", "README.md", "VERSION", "tools/site_versions.py"]
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # release_manifest.py --check diffs against report_source_commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated numbers, tables and README block are up to date
        run: python3 research/paper/gen_numbers.py --check
      - name: Result distribution file is up to date
        run: |
          python3 evaluation/consolidated/e1_distribution.py evaluation/consolidated/results >/dev/null
          git diff --exit-code -- evaluation/consolidated/results/e1_distribution.json
      - name: Website code blocks are syntax-highlighted
        run: python3 tools/highlight_site.py --check
      - name: Website PDFs are byte-identical to the report PDFs
        run: research/paper/sync_site.sh --check
      - name: SIGMOD PDF obeys the basic packaging constraints
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          python3 research/paper/check_submission.py
      - name: Release manifest matches the report files
        run: python3 research/paper/release_manifest.py --check
      - name: Website SEO metadata and crawl files are consistent
        run: python3 tools/site_seo.py --check
      - name: Website shows the current release and report versions
        run: python3 tools/site_versions.py --check

  industrial-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.1.3
      - run: python -m unittest discover -s research/paper -p test_industrial.py -v
      - run: python research/paper/replay_industrial.py --check
