name: Optional TimescaleDB integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/timescale/**'
      - 'examples/timescale/**'
      - 'evaluation/timescale_coexistence/**'
      - '.github/workflows/timescale-integration.yml'
permissions:
  contents: read
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'psycopg[binary]==3.2.10' 'numpy==2.2.6'
      - name: Build pinned optional extension pair
        run: docker build -t morlet-tc1:experiment -f evaluation/timescale_coexistence/Dockerfile evaluation/timescale_coexistence
      - name: Native integration regressions
        run: python -m unittest discover -s tools/timescale/tests -v
      - name: Coexistence and recovery drill
        run: python evaluation/timescale_coexistence/run.py
      - name: Browser dependencies
        run: |
          pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Grafana and waveform browser smoke
        run: python examples/timescale/smoke.py
      - name: Keep drill evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timescale-${{ matrix.runner }}
          path: evaluation/timescale_coexistence/results/*.json
