# C8 database: the released image, on its own project name and port.
#   docker compose -p c8ctx -f evaluation/context/c8/compose.yaml up -d
#   docker compose -p c8ctx -f evaluation/context/c8/compose.yaml down -v
name: c8ctx
services:
  db:
    image: ghcr.io/merkhet-io/morletdb:0.3.14-alpha.1
    environment: {POSTGRES_USER: morlet, POSTGRES_PASSWORD: c8-local-only, POSTGRES_DB: morlet}
    command: ["postgres", "-c", "shared_buffers=1GB", "-c", "max_wal_size=8GB", "-c", "work_mem=64MB",
              "-c", "synchronous_commit=off"]
    shm_size: 1g
    ports: ["127.0.0.1:28861:5432"]
    volumes: [c8-data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U morlet -d morlet"], interval: 2s, timeout: 3s, retries: 30}
volumes:
  c8-data:
