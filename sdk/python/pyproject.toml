[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morletdb"
version = "0.1.0a1"
description = "Python client for MorletDB: store waveform recordings losslessly, read exact intervals, search similar intervals"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "psycopg[binary]>=3.1"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/merkhet-io/morletdb"
Documentation = "https://github.com/merkhet-io/morletdb/blob/main/docs/python-sdk.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
morletdb = ["py.typed", "_lib/*"]
