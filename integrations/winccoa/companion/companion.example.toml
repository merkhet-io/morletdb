# MorletDB WinCC OA companion: example configuration (the replay machine of integrations/winccoa/replay).
# Values marked "proposed default, owner decision pending" are the proposals of docs/winccoa.md, not approved values.

[service]
listen = "127.0.0.1:8770"                 # loopback only (remote binding is not in phases A and B)
token_file = "/run/morlet-winccoa/token"  # mode 0600, one or two tokens (current and next)
dsn = "service=morlet_winccoa"            # no password here: use a libpq service file or passfile with mode 0600
schema = "morlet_winccoa"                 # decision 1, option (a): proposed default, owner decision pending
context_role = "winccoa_context"          # decision 5: one login role with two group roles:
reader_role = "winccoa_reader"            #   proposed default, owner decision pending
derive_interval_s = 5.0

[clock]
bound_ms = 50.0                 # decision 3: proposed default, owner decision pending
daq_bound_ms = 0.0              # declare the companion-DAQ bound when the companion is not on the DAQ host
heartbeat_interval_s = 10.0     # decision 2: proposed default, owner decision pending
allow_observed_time_basis = false   # decision 3: proposed default, owner decision pending

[limits]                        # decision 6: phase-A starting values; proposed defaults, owner decision pending
observations_per_message = 1000
body_bytes = 1048576
datapoints = 500
top_k_default = 10
top_k_max = 50
investigations_total = 4
response_bytes = 262144
overview_buckets = 16
statement_timeout_ms = 10000
http_deadline_ms = 15000
max_candidates = 1000000
window_min = 512
window_max = 32768
window_default = 4096
writer_batch_samples = 65536
auth_failures_per_minute = 5
auth_backoff_s = 60

[viewer]
base_url = ""                   # e.g. "http://127.0.0.1:8765": links only to a loopback viewer (section 7)

[[assets]]
name = "rig-1"
collection = "plant.rig"
machine = "rig-1"

[[datapoints]]
dpe = "System1:Rig1.speed"
asset = "rig-1"
key = "speed"
time_basis = "source"
accept_missing_quality = false  # proposed default, owner decision pending (quality attributes: open question 2)

[[datapoints]]
dpe = "System1:Rig1.load"
asset = "rig-1"
key = "load"
