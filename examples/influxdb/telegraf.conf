# Telegraf for the InfluxDB example: the MorletDB metric bridge as an execd input, InfluxDB 2.x as output.
[agent]
  interval = "5s"
  flush_interval = "5s"
  precision = "1ns"                 # keep the bridge's nanosecond timestamps
  omit_hostname = true

[[inputs.execd]]
  command = ["python3", "/opt/morlet/bridge/cli.py", "telegraf", "telegraf"]
  signal = "STDIN"                  # a newline each interval; the bridge answers with the pending points
  restart_delay = "5s"
  data_format = "influx"
  environment = ["PGHOST=morletdb", "PGDATABASE=plant", "PGUSER=morlet", "PGPASSWORD=influx-demo-only"]

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "$INFLUX_TOKEN"
  organization = "plant"
  bucket = "machines"
