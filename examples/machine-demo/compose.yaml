# MorletDB machine demo (bearing run-to-failure). See README.md.
#   docker compose run --rm load            # download NASA/IMS test 2 (about 1 GB) and import it
#   docker compose run --rm -i -T mcp       # the MorletDB MCP server on stdio (what Claude Code / Desktop start)
name: morletdb-machine-demo
services:
  db:
    image: ${MORLET_IMAGE:-ghcr.io/merkhet-io/morletdb:0.3.6-alpha.1}
    environment:
      POSTGRES_USER: morlet
      POSTGRES_PASSWORD: morlet-demo-only
      POSTGRES_DB: morlet
    ports:
      - "127.0.0.1:54332:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morlet -d morlet"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s
  load:
    build:
      context: ../..
      dockerfile: examples/machine-demo/Dockerfile
    image: morletdb-machine-demo-tools:local
    environment:
      DATABASE_URL: postgresql://morlet:morlet-demo-only@db:5432/morlet
    volumes:
      - data:/data
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "examples/machine-demo/load.py", "/data"]
  mcp:
    image: morletdb-machine-demo-tools:local
    environment:
      DATABASE_URL: postgresql://machine_reader:machine-demo-only@db:5432/morlet
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "tools/mcp/morlet_mcp.py"]
volumes:
  db:
  data:
