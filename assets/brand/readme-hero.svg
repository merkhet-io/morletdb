<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="t d">
<title id="t">MorletDB — Recordings, not rows.</title>
<desc id="d">Signal retrieval for agents and engineers in PostgreSQL. Illustrative waveform, not measured data.</desc>
<rect width="1280" height="500" rx="18" fill="#090c0d"/>
<rect x="0.5" y="0.5" width="1279" height="499" rx="18" fill="none" stroke="#24302e"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <text x="64" y="72" font-size="21" font-weight="650" fill="#e4e8e6" letter-spacing="-0.5">morlet<tspan fill="#a8df73">db</tspan></text>
  <text x="1216" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8a9793" letter-spacing="1.8" text-anchor="end">POSTGRESQL EXTENSION · APACHE 2.0</text>
  <circle cx="69" cy="139" r="3.5" fill="#a8df73"/>
  <text x="84" y="143" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#8a9793" letter-spacing="1.9">SIGNAL RETRIEVAL FOR AGENTS &amp; ENGINEERS / POSTGRESQL</text>
  <text x="60" y="236" font-family="Georgia, 'Times New Roman', serif" font-size="84" fill="#e4e8e6" letter-spacing="-3">Recordings,</text>
  <text x="60" y="324" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-style="italic" fill="#a8df73" letter-spacing="-3">not rows.</text>
  <text x="64" y="382" font-size="19" fill="#e4e8e6">Give your AI agents a way to investigate signals.</text>
  <text x="64" y="414" font-size="16" fill="#8a9793">Store recordings losslessly, retrieve similar intervals, and bring the original</text>
  <text x="64" y="438" font-size="16" fill="#8a9793">samples and metadata into the analysis — all inside PostgreSQL.</text>
</g>
