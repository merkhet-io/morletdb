<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
<title id="title">How MorletDB turns a recording into inspectable evidence</title>
<desc id="desc">A recording is appended as raw chunks into PostgreSQL with pg_morlet. Rust Morlet extraction writes versioned window features in the same transaction. A query interval is searched exactly against compatible recordings, producing ranked matches that are read back as original samples with their acquisition context.</desc>
<defs>
<linearGradient id="surface" x2="1" y2="1"><stop stop-color="#101E30"/><stop offset="1" stop-color="#08111C"/></linearGradient>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#7AA9BC" stroke-opacity=".045"/></pattern>
<linearGradient id="signal" x2="1"><stop stop-color="#70F0CA"/><stop offset=".58" stop-color="#39C9DF"/><stop offset="1" stop-color="#718DFF"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#39C9DF"/></marker>
</defs>
<rect width="1120" height="300" rx="24" fill="url(#surface)"/>
<rect width="1120" height="300" rx="24" fill="url(#grid)"/>
<g font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">
<text x="32" y="46" fill="#6F8799" font-size="12" font-weight="700" letter-spacing="2.4">FROM RECORDING TO EVIDENCE</text>
<rect x="32" y="56" width="140" height="2" rx="1" fill="url(#signal)"/>
<rect x="198" y="82" width="544" height="124" rx="18" fill="none" stroke="#39C9DF" stroke-opacity=".45" stroke-dasharray="5 6"/>
<text x="216" y="101" fill="#39C9DF" font-size="11" font-weight="700" letter-spacing="1.6">POSTGRESQL · PG_MORLET</text>
<g fill="#0B1523" stroke="#233649" stroke-width="1.5">
<rect x="32" y="112" width="156" height="80" rx="14"/>
<rect x="212" y="112" width="156" height="80" rx="14"/>
<rect x="392" y="112" width="156" height="80" rx="14"/>
<rect x="572" y="112" width="156" height="80" rx="14" stroke="#39C9DF"/>
<rect x="752" y="112" width="156" height="80" rx="14"/>
<rect x="932" y="112" width="156" height="80" rx="14" stroke="#70F0CA"/>
<rect x="572" y="234" width="156" height="42" rx="12"/>
</g>
<g stroke="#39C9DF" stroke-width="2" marker-end="url(#arrow)">
<path d="M190 152H208"/><path d="M370 152H388"/><path d="M550 152H568"/><path d="M730 152H748"/><path d="M910 152H928"/>
<path d="M650 232V196"/>
</g>
<g fill="#F1F7FA" font-size="15" font-weight="700">
<text x="46" y="140">Recording</text>
<text x="226" y="140">Raw chunks</text>
<text x="406" y="140">Features</text>
<text x="586" y="140">Exact search</text>
<text x="766" y="140">Matches</text>
<text x="946" y="140">Raw samples</text>
<text x="586" y="260" font-size="14">Query interval</text>
</g>
<g fill="#9FB3C2" font-size="12">
<text x="46" y="162">one channel</text><text x="46" y="179">rate · units</text>
<text x="226" y="162">append-only</text><text x="226" y="179">durable retries</text>
<text x="406" y="162">Rust Morlet</text><text x="406" y="179">same transaction</text>
<text x="586" y="162">compatible only</text><text x="586" y="179">budgeted scan</text>
<text x="766" y="162">ranked intervals</text><text x="766" y="179">no overlaps</text>
<text x="946" y="179">+ context</text>
</g>
<text x="946" y="162" fill="#70F0CA" font-size="12" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace">read_interval</text>
</g>
