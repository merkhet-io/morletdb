[workspace]
members = ["crates/morlet-core", "extensions/pg_morlet"]
default-members = ["crates/morlet-core"]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/merkhet-io/morletdb"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
lto = "thin"
