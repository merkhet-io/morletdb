services:
  db:
    image: ${MORLET_IMAGE:?Set MORLET_IMAGE to a release tag or digest}
    platform: linux/amd64
    environment:
      POSTGRES_USER: morlet
      POSTGRES_PASSWORD: morlet-demo-only
      POSTGRES_DB: morlet
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - morlet-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morlet -d morlet"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
  walkthrough:
    image: python:3.12.10-slim-bookworm
    working_dir: /src
    volumes:
      - .:/src:ro
    environment:
      DATABASE_URL: postgresql://morlet:morlet-demo-only@db:5432/morlet
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "pip install --no-cache-dir -r tools/ingest/requirements.txt && python examples/inspect_recordings.py"]
volumes:
  morlet-data:
